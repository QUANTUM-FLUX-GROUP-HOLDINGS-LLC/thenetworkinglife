<section class="language-gate" id="languageGate">
    <span class="eyebrow">Interactive Training</span>
    <h1 class="language-title">
      <span>Elige tu idioma</span>
      <span>Choose your language</span>
    </h1>
    <p class="hero-copy">
      Selecciona el idioma que prefieres para ver la información completa.
    </p>
    <div class="language-actions">
      <button class="language-button" type="button" data-language="es">Español</button>
      <button class="language-button" type="button" data-language="en">English</button>
      <button class="language-button" type="button" data-language="ko">한국어</button>
      <button class="language-button" type="button" data-language="zh">中文</button>
    </div>
  </section>
